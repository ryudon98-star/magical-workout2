<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#21182d"><title>魔法学校の家トレ記録</title>
<style>
:root{--bg:#15121c;--p:#211b2b;--p2:#2b2238;--line:#493957;--t:#f4edf8;--m:#bdb0c9;--g:#e8cc8b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#30213f,#17131f 52%,#100e16);color:var(--t);font:16px/1.5 system-ui,sans-serif}header{text-align:center;padding:22px 12px;border-bottom:1px solid var(--line);background:#17121e}h1{margin:0;color:var(--g);font-size:clamp(1.3rem,5vw,2rem)}header p,.muted,.small{color:var(--m);font-size:.85rem}main{max-width:1000px;margin:auto;padding:12px;display:grid;gap:12px}.panel{background:linear-gradient(145deg,#241d30,#1b1724);border:1px solid var(--line);border-radius:15px;padding:14px}h2{font-size:1.08rem;color:var(--g);margin:0 0 12px}button,input,select{font:inherit}button{background:var(--p2);border:1px solid #675078;border-radius:9px;padding:9px 12px;color:var(--t);cursor:pointer}button.primary{background:#49345f}button.gold{background:#4b3b2a;border-color:#a58a56;color:#ffe9b3}button.danger{background:#39232d;border-color:#81505c;color:#f1b5bd}input,select,textarea{background:#17131f;color:var(--t);border:1px solid #5a4968;border-radius:8px;padding:8px;max-width:100%}label{display:block;color:var(--m);font-size:.82rem;margin-bottom:4px}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.spread{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.weekday{text-align:center;color:var(--m);font-size:.78rem}.day{min-height:42px;padding:6px 1px;background:#2b2436;border:1px solid #453651;border-radius:7px;text-align:center}.day.muted{opacity:.4}.day.today{border-color:var(--g)}.day.selected{background:#59426e;border-color:#c8a5e5}.day.has:after{content:"•";display:block;color:var(--g);font-size:.7rem;line-height:.7}.statgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:10px 0}.stat{background:#2a2135;border-radius:9px;padding:9px}.stat strong{display:block;color:var(--g)}.stat span{font-size:.75rem;color:var(--m)}.exercise{background:#1a1522;border:1px solid #44344f;border-radius:10px;padding:10px;margin-top:9px}.set{display:grid;grid-template-columns:.6fr 1fr 1fr auto;gap:5px;align-items:end;margin:7px 0}.set input{width:100%;min-width:0}.set button{padding:7px}.week{border:1px solid #45344f;border-radius:9px;margin-top:8px;overflow:hidden}.week summary{padding:10px;background:#2a2135;color:var(--g);cursor:pointer}.weekbody{padding:10px}.histday{padding:8px 0;border-bottom:1px solid #3b2e45}.histday:last-child{border:0}canvas{width:100%;height:220px;background:#191420;border:1px solid var(--line);border-radius:9px}.empty{text-align:center;padding:18px;color:var(--m)}.notice{background:#2b2436;padding:10px;border-radius:8px;color:var(--m);font-size:.85rem}.hidden{display:none}@media(min-width:780px){main{grid-template-columns:1fr 1fr}.wide{grid-column:1/-1}}@media(max-width:440px){.panel{padding:11px}.set{grid-template-columns:.5fr 1fr 1fr auto;gap:3px}.set input{padding:7px 4px}.day{min-height:38px}}
</style></head><body>
<header><h1>✦ 魔法学校の家トレ記録 ✦</h1><p>今日の積み重ねが、未来の自分をつくる。</p></header>
<main>
<section class="panel"><div class="spread"><button id="prev">‹</button><strong id="month" style="color:var(--g)"></strong><button id="next">›</button></div><div id="cal" class="calendar" style="margin-top:10px"></div><p class="small">● が付いた日は記録あり。日付をタップして記録を確認できます。</p><div class="row"><button id="today">今日に戻る</button><button id="export">バックアップを書き出す</button><button id="import">読み込む</button><input id="file" class="hidden" type="file" accept="application/json"></div></section>
<section class="panel"><h2>📅 トレーニング記録</h2><label>日付</label><input type="date" id="date"><div class="statgrid"><div class="stat"><span>種目数</span><strong id="sx">0</strong></div><div class="stat"><span>セット数</span><strong id="ss">0</strong></div><div class="stat"><span>総負荷 kg×回</span><strong id="sl">0</strong></div></div><div id="editor"></div><div class="row" style="margin-top:10px"><button class="primary" id="add">＋ 種目を記録</button><button class="danger" id="clear">この日の記録を削除</button></div><p class="small">重量はkg、回数は回。自重トレは重量0kgでも記録できます。</p></section>
<section class="panel wide"><div class="spread"><h2>📚 過去の記録（週ごと）</h2><select id="weeks"><option value="4">直近4週間</option><option value="8" selected>直近8週間</option><option value="12">直近12週間</option><option value="all">すべて</option></select></div><div id="history"></div></section>
<section class="panel wide"><h2>📈 トレーニング推移グラフ</h2><div class="row"><div style="flex:1"><label>種目</label><select id="gx" style="width:100%"></select></div><div style="flex:1"><label>表示</label><select id="gm" style="width:100%"><option value="load">総負荷（kg×回）</option><option value="weight">最大重量（kg）</option><option value="reps">合計回数</option></select></div></div><canvas id="chart" width="900" height="300"></canvas><p id="gc" class="small"></p></section>
<section class="panel wide"><h2>✨ AIコーチへのご褒美コメント</h2><p></p><div class="row"><div style="flex:1"><label>分析期間</label><select id="period" style="width:100%"><option value="7">直近7日間</option><option value="14">直近14日間</option><option value="3">直近3回のトレーニング日</option><option value="all">直近7日間＋過去記録との比較</option></select></div><div style="flex:1"><label>詳しさ</label><select id="detail" style="width:100%"><option value="balanced">標準</option><option value="short">短め</option><option value="detailed">詳しく</option></select></div></div><div class="row" style="margin-top:12px"><button class="gold" id="copy">✦ 診断プロンプトをコピー</button></div><p id="status" class="notice">コピーした文章をChatGPTに貼り付けてください。API接続や料金は不要です。</p><textarea id="fallback" class="hidden" rows="10" style="width:100%"></textarea></section>
</main>
<script>
(()=>{const DEFAULT=['腕立て','腹筋','ショルダープレス','サイドレイズ','アームカール','フレンチプレス'],KEY='magicHomeWorkout_v3', $=x=>document.getElementById(x);
const iso=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,shift=(s,n)=>{let d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)},pretty=s=>{let [y,m,d]=s.split('-');return `${y}年${+m}月${+d}日`};
let st={exercises:[...DEFAULT],records:{}},sel=iso(),mv=new Date();
try{let x=JSON.parse(localStorage.getItem(KEY)||'null');if(x?.records&&Array.isArray(x.exercises))st={exercises:[...new Set([...DEFAULT,...x.exercises])],records:x.records}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){alert('保存できません。バックアップを書き出してください。')}};
const day=s=>st.records[s]||{}, arr=(s,e)=>day(s)[e]||[], dates=()=>Object.keys(st.records).filter(s=>Object.values(day(s)).some(a=>Array.isArray(a)&&a.length)).sort();
function choose(s){sel=s;$('date').value=s;mv=new Date(s+'T12:00:00');renderCal();renderEditor();stats()}
function renderCal(){let y=mv.getFullYear(),m=mv.getMonth();$('month').textContent=`${y}年${m+1}月`;let root=$('cal');root.innerHTML='';['日','月','火','水','木','金','土'].forEach(w=>{let a=document.createElement('div');a.className='weekday';a.textContent=w;root.append(a)});let first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate(),pn=new Date(y,m,0).getDate();for(let i=0;i<42;i++){let d,dt,other=false;if(i<first){d=pn-first+i+1;dt=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;other=true}else if(i>=first+n){d=i-first-n+1;dt=iso(new Date(y,m+1,d));other=true}else{d=i-first+1;dt=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`}let b=document.createElement('button');b.className='day'+(other?' muted':'')+(dt===iso()?' today':'')+(dt===sel?' selected':'')+(Object.values(day(dt)).some(a=>a.length)?' has':'');b.textContent=d;b.onclick=()=>choose(dt);root.append(b)}}
function renderEditor(){let root=$('editor');root.innerHTML='';st.exercises.forEach(ex=>{let card=document.createElement('div');card.className='exercise';let head=document.createElement('div');head.className='spread';let h=document.createElement('strong');h.textContent=ex;head.append(h);let tools=document.createElement('div');tools.className='row';let add=document.createElement('button');add.textContent='＋セット';add.onclick=()=>{let d=day(sel),a=arr(sel,ex).slice();a.push({weight:'',reps:''});d[ex]=a;st.records[sel]=d;save();renderEditor();stats()};tools.append(add);if(!DEFAULT.includes(ex)){let rm=document.createElement('button');rm.className='danger';rm.textContent='種目削除';rm.onclick=()=>{if(confirm(`${ex}を一覧から削除しますか？過去の記録は残ります。`)){st.exercises=st.exercises.filter(x=>x!==ex);save();renderAll()}};tools.append(rm)}head.append(tools);card.append(head);let a=arr(sel,ex);if(!a.length){let p=document.createElement('p');p.className='small';p.textContent='まだセットの記録はありません。';card.append(p)}a.forEach((s,i)=>{let row=document.createElement('div');row.className='set';let no=document.createElement('span');no.className='small';no.textContent=`${i+1}セット`;row.append(no);for(let [key,label,placeholder] of [['weight','重量 kg','例 10'],['reps','回数','例 12']]){let box=document.createElement('div'),lab=document.createElement('label'),inp=document.createElement('input');lab.textContent=label;inp.type='number';inp.min='0';inp.step=key==='weight'?'0.5':'1';inp.placeholder=placeholder;inp.value=s[key];inp.onchange=()=>{let d=day(sel),z=arr(sel,ex).slice();z[i][key]=inp.value;d[ex]=z;st.records[sel]=d;save();stats()};box.append(lab,inp);row.append(box)}let del=document.createElement('button');del.className='danger';del.textContent='×';del.onclick=()=>{let d=day(sel),z=arr(sel,ex).slice();z.splice(i,1);d[ex]=z;st.records[sel]=d;save();renderEditor();stats()};row.append(del);card.append(row)});root.append(card)})}
function stats(){let valid=Object.entries(day(sel)).flatMap(([e,a])=>a.filter(s=>s.weight!==''&&s.reps!==''&&+s.reps>0).map(s=>({...s,ex:e})));$('sx').textContent=new Set(valid.map(s=>s.ex)).size;$('ss').textContent=valid.length;$('sl').textContent=Math.round(valid.reduce((n,s)=>n+(+s.weight||0)*(+s.reps||0),0)*10)/10;renderCal();history()}
function history(){let ds=dates().reverse(),f=$('weeks').value;if(f!=='all'){let cut=shift(iso(),-Number(f)*7+1);ds=ds.filter(d=>d>=cut&&d<=iso())}let root=$('history');root.innerHTML='';if(!ds.length){root.innerHTML='<div class="empty">記録はまだありません。入力すると週ごとに表示されます。</div>';return}let groups={};ds.forEach(d=>{let x=new Date(d+'T12:00:00');x.setDate(x.getDate()-x.getDay());let k=iso(x);(groups[k]??=[]).push(d)});Object.entries(groups).forEach(([start,list],idx)=>{let det=document.createElement('details');det.className='week';det.open=idx===0;let sum=document.createElement('summary');sum.textContent=`${pretty(start)}〜${pretty(shift(start,6))}（${list.length}日）`;det.append(sum);let body=document.createElement('div');body.className='weekbody';list.forEach(d=>{let item=document.createElement('div');item.className='histday';let b=document.createElement('strong');b.textContent=pretty(d);item.append(b);let ul=document.createElement('ul');Object.entries(day(d)).forEach(([ex,a])=>{let v=a.filter(s=>s.weight!==''&&s.reps!==''&&+s.reps>0);if(v.length){let li=document.createElement('li');li.textContent=`${ex}：${v.map(s=>`${s.weight||0}kg×${s.reps}回`).join('、')}`;ul.append(li)}});item.append(ul);let btn=document.createElement('button');btn.textContent='この日を開く';btn.onclick=()=>choose(d);item.append(btn);body.append(item)});det.append(body);root.append(det)})}
function graphOptions(){let s=$('gx'),old=s.value;s.innerHTML='';st.exercises.forEach(e=>{let o=document.createElement('option');o.value=e;o.textContent=e;s.append(o)});if(st.exercises.includes(old))s.value=old;graph()}
function graph(){let c=$('chart'),x=c.getContext('2d'),w=c.width,h=c.height;x.clearRect(0,0,w,h);x.fillStyle='#191420';x.fillRect(0,0,w,h);let ex=$('gx').value,metric=$('gm').value,ds=dates().filter(d=>arr(d,ex).some(s=>s.weight!==''&&s.reps!==''&&+s.reps>0)).slice(-12),vs=ds.map(d=>{let a=arr(d,ex).filter(s=>s.weight!==''&&s.reps!==''&&+s.reps>0);return metric==='weight'?Math.max(...a.map(s=>+s.weight||0)):metric==='reps'?a.reduce((n,s)=>n+(+s.reps||0),0):a.reduce((n,s)=>n+(+s.weight||0)*(+s.reps||0),0)});if(!ds.length){x.fillStyle='#bdb0c9';x.textAlign='center';x.font='18px sans-serif';x.fillText('記録を入力するとグラフが表示されます',w/2,h/2);$('gc').textContent='直近12回分を表示します。';return}let max=Math.max(1,...vs)*1.15,L=52,R=18,T=22,B=45,cw=w-L-R,ch=h-T-B;x.font='12px sans-serif';for(let i=0;i<=4;i++){let y=T+ch*i/4;x.strokeStyle='#4a3a55';x.beginPath();x.moveTo(L,y);x.lineTo(w-R,y);x.stroke();x.fillStyle='#bdb0c9';x.textAlign='right';x.fillText(Math.round(max*(4-i)/4),L-7,y+4)}let pts=vs.map((v,i)=>({x:ds.length===1?L+cw/2:L+cw*i/(ds.length-1),y:T+ch*(1-v/max),v}));x.strokeStyle='#e8cc8b';x.lineWidth=3;x.beginPath();pts.forEach((p,i)=>i?x.lineTo(p.x,p.y):x.moveTo(p.x,p.y));x.stroke();pts.forEach((p,i)=>{x.fillStyle='#e8cc8b';x.beginPath();x.arc(p.x,p.y,4,0,Math.PI*2);x.fill();x.textAlign='center';x.fillText(Math.round(p.v*10)/10,p.x,p.y-10);x.fillStyle='#bdb0c9';x.fillText(ds[i].slice(5).replace('-','/'),p.x,h-18)});$('gc').textContent=`${ex}：${metric==='load'?'総負荷（kg×回）':metric==='weight'?'最大重量（kg）':'合計回数'}。直近${ds.length}回。`}
function makePrompt(){let period=$('period').value,t=iso(),ds=dates().filter(d=>d<=t);if(period==='3')ds=ds.slice(-3);else{let days=period==='all'?7:+period,cut=shift(t,-days+1);ds=ds.filter(d=>d>=cut)}let lines=[];function appendDates(list){list.forEach(d=>{lines.push(`【${pretty(d)}】`);Object.entries(day(d)).forEach(([ex,a])=>{let v=a.filter(s=>s.weight!==''&&s.reps!==''&&+s.reps>0);if(v.length)lines.push(`- ${ex}: ${v.map((s,i)=>`${i+1}セット ${s.weight||0}kg × ${s.reps}回`).join('、')}`)})})}appendDates(ds);if(period==='all'){let old=dates().filter(d=>d<shift(t,-6)).slice(-12);if(old.length){lines.push('【過去の比較用記録】');appendDates(old)}}let detail={short:'全体評価と次回の提案を簡潔に',balanced:'全体評価、種目別の傾向、過去との比較、次回の提案を標準的な詳しさで',detailed:'種目別推移、重量・回数・セット数から読み取れる強度の傾向、記録の限界、休息やフォームへの配慮、次回の具体案を詳しく'}[$('detail').value];return `あなたは、魅惑的でミステリアス、余裕があり少し小悪魔的な「お姉さん」口調のトレーニングコーチです。分析は記録に忠実で具体的にし、最後のご褒美コメントは、思わずドキッとするほど刺激的で、挑発的な言葉の余韻や甘やかす雰囲気を込めてください。露骨な性的表現は避け、上品で playful な表現にしてください。\n\n【依頼】\n以下の家トレ記録を分析してください。\n・重量、回数、セット数から負荷の傾向を評価\n・前回や過去の記録と比較し、確認できる変化を説明\n・種目別の評価と、次回への無理のない提案\n・フォーム、主観的なきつさ、休息は記録から分からないため断定しない\n・痛みや体調を無視して負荷を上げる提案はしない\n・データ不足の種目は推測せず、判断できないと明記\n・分析の詳しさ：${detail}\n・口調：魅惑的でミステリアス、余裕のある小悪魔的なお姉さん。最後は刺激的で挑発的な余韻を残しつつ、優しく甘やかす。露骨な性的表現や侮辱は避ける\n・最後に「ご褒美コメント」を付ける\n\n【トレーニング記録】\n${lines.length?lines.join('\n'):'対象期間の有効なトレーニング記録はありません。記録を入力してから再度依頼するよう案内してください。'}\n\nこのデータだけを根拠に日本語で回答してください。`}
async function copy(){let text=makePrompt(),status=$('status'),fallback=$('fallback');fallback.classList.add('hidden');try{await navigator.clipboard.writeText(text);status.textContent='コピーしました！このチャットを開いて貼り付けてください。'}catch(e){fallback.value=text;fallback.classList.remove('hidden');fallback.focus();fallback.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}status.textContent=ok?'コピーしました！このチャットに貼り付けてください。':'自動コピーできないため、下の文章を選択してコピーしてください。'}}
$('prev').onclick=()=>{mv.setMonth(mv.getMonth()-1);renderCal()};$('next').onclick=()=>{mv.setMonth(mv.getMonth()+1);renderCal()};$('today').onclick=()=>choose(iso());$('date').onchange=e=>choose(e.target.value||iso());$('weeks').onchange=history;$('gx').onchange=graph;$('gm').onchange=graph;$('copy').onclick=copy;
$('add').onclick=()=>{let name=prompt('記録したい種目名を入力してください。');if(!name?.trim())return;name=name.trim();if(!st.exercises.includes(name))st.exercises.push(name);let d=day(sel),a=arr(sel,name).slice();a.push({weight:'',reps:''});d[name]=a;st.records[sel]=d;save();renderEditor();stats();graphOptions()};
$('clear').onclick=()=>{if(confirm(`${pretty(sel)}の記録をすべて削除しますか？`)){delete st.records[sel];save();renderEditor();stats();graphOptions()}};
$('export').onclick=()=>{let u=URL.createObjectURL(new Blob([JSON.stringify(st,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='家トレ記録バックアップ.json';a.click();URL.revokeObjectURL(u)};
$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let s=JSON.parse(await f.text());if(!Array.isArray(s.exercises)||!s.records)throw 0;if(confirm('現在の記録を読み込んだデータに置き換えますか？')){st={exercises:[...new Set([...DEFAULT,...s.exercises])],records:s.records};save();renderAll()}}catch(_){alert('バックアップを読み込めません。正しいJSONファイルか確認してください。')}e.target.value=''};
function renderAll(){choose(sel);graphOptions();history()}$('date').value=sel;renderAll();
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>
<link rel="manifest" href="./manifest.webmanifest">
</body></html>
